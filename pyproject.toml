[project]
name = "corbin"
version = "0.1.1"
description = "Graph-aware RAG system for Notion-backed technical knowledge bases."
readme = "README.md"
requires-python = ">=3.11.7"
authors = [
  { name = "Suhail" }
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "swivelpy>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/clariform/corbin"
Repository = "https://github.com/clariform/corbin"
Issues = "https://github.com/clariform/corbin/issues"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
